name: Build Android APK and Web app
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # The repo holds only lib/, pubspec.yaml and supabase/. Generate the android/ and web/
      # shells here, keeping our own lib/ and pubspec.yaml untouched.
      - name: Generate Android and web shells
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --org app.edubreeds --project-name edubreeds_app --platforms=android,web .
          rm -rf lib && cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          rm -rf test

      - name: Add Android permissions
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ''.join(f'    <uses-permission android:name="android.permission.{n}"/>\n' for n in [
              'INTERNET', 'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION', 'FOREGROUND_SERVICE',
              'FOREGROUND_SERVICE_LOCATION', 'CAMERA', 'WAKE_LOCK', 'POST_NOTIFICATIONS'])
          if 'ACCESS_FINE_LOCATION' not in s:
              s = s.replace('<application', perms + '    <application', 1)
          open(p, 'w').write(s)
          EOF

      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: build/web
